
# ==========================================
# Application
# ==========================================
spring.application.name=${SPRING_APPLICATION_NAME:OrbitLogisticApp}
server.port=${SERVER_PORT:8000}


# ==========================================
# PostgreSQL Connection
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate


# ==========================================
# JWT Configuration
# ==========================================
spring.app.jwtSecret=${JWT_SECRET}


# ==========================================
# SMTP Configuration
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ==========================================
# React + TypeScript Frontend
# ==========================================
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}


# ==========================================
# MCP Server Configuration
# ==========================================
spring.ai.mcp.server.name=${MCP_SERVER_NAME:orbit-vmi}
spring.ai.mcp.server.version=${MCP_SERVER_VERSION:1.0.0}
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC


# ==========================================
# MCP Client Configuration
# ==========================================
spring.ai.mcp.client.name=${MCP_CLIENT_NAME:orbit-chat-client}
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=true


# ==========================================
# Connection to Orbit MCP Server
# ==========================================
spring.ai.mcp.client.streamable-http.connections.orbit-vmi.url=${MCP_SERVER_URL:http://localhost:8000}
spring.ai.mcp.client.streamable-http.connections.orbit-vmi.endpoint=${MCP_SERVER_ENDPOINT:/mcp}


# ==========================================
# OpenAI Configuration
# ==========================================
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-5.4-mini}
